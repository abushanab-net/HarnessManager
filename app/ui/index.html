<!doctype html>
<html lang="en" data-brand="hm" data-theme="dark" data-motion="live">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Manager</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="pages-overview.css">

<body>
<svg width="0" height="0" class="svg-defs" aria-hidden="true"><defs>
  <pattern id="starve-stripe" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="10"/></pattern>
</defs></svg>
<div class="frame">
  <!-- the shell as the 1.10 drawings draw it (docs/project-review-2026-11/mockups/a.js). A badge appears only for
       something to act on or watch, with its unit: "N live", "▲ N" accounts that need attention, "N updates". -->
  <aside class="rail" data-region="rail" aria-label="Main navigation">
    <div class="brand-box" id="brand"><div class="brand-logo" id="brand-mark"></div><div class="brand-text"><b>Harness Manager</b><span id="brand-sub" data-testid="brand-sub">Loading…</span></div></div>
    <nav class="nav" id="nav-main" aria-label="Primary pages">
      <a class="nav-item" data-nav="home" href="#home" data-testid="nav-home"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="nav-label">Overview</span></a>
      <a class="nav-item" data-nav="sessions" href="#sessions" data-testid="nav-sessions"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4l4 4-4 4M9 12h4"/></svg><span class="nav-label">Sessions</span><span class="pill ok badge" id="n-live" data-act="go-live" role="link" title="The sessions running now" hidden data-testid="nav-live"></span></a>
      <a class="nav-item" data-nav="projects" href="#projects" data-testid="nav-projects"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5a1 1 0 011-1h3l1.5 1.5H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1z"/></svg><span class="nav-label">Projects</span></a>
      <button class="nav-fold-chip" data-act="nav-fold" data-fold="nav-pins" aria-label="Show or hide the pinned projects" hidden data-testid="fold-pins">Pinned</button>
      <div id="nav-pins" class="nav-sublist" data-testid="nav-pins"></div>
      <a class="nav-item" data-nav="accounts" href="#accounts" data-testid="nav-accounts"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.4 2.6-3.5 5-3.5s4.4 1.1 5 3.5"/></svg><span class="nav-label">Accounts</span><span class="pill warn badge" id="n-attention" hidden data-testid="nav-attention"></span></a>
      <a class="nav-item" data-nav="computers" href="#computers" data-testid="nav-computers"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1"/><path d="M6 13.5h4M8 11v2.5"/></svg><span class="nav-label">Computers</span></a>

      <div id="nav-setup" class="nav-sublist">
        <a class="nav-subitem" data-nav="mcp" href="#mcp" data-testid="nav-mcp">MCP servers</a>
        <a class="nav-subitem" data-nav="skills" href="#skills" data-testid="nav-skills">Skills</a>
        <a class="nav-subitem" data-nav="prompts" href="#prompts" data-testid="nav-prompts">System prompts</a>
        <a class="nav-subitem" data-nav="routing" href="#routing" data-testid="nav-routing">API keys &amp; routing</a>
        <a class="nav-subitem" data-nav="apps" href="#apps" data-testid="nav-apps">Apps</a>
      </div>
    </nav>
    <nav class="nav bottom" aria-label="Reference and settings">
      <a class="nav-item" data-nav="cli" href="#cli" data-testid="nav-cli"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 7l2 1.5L5 10M8.5 10.5H11"/></svg><span class="nav-label">CLI reference</span></a>
      <a class="nav-item" data-nav="settings" href="#settings" data-testid="nav-settings"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h7M12 5h2M2 11h2M7 11h7"/><circle cx="10.5" cy="5" r="1.5"/><circle cx="5.5" cy="11" r="1.5"/></svg><span class="nav-label">Settings</span><span class="pill ok badge" id="settings-upd" title="A newer Harness Manager is available: Settings › Updates installs it" hidden data-testid="settings-upd">1 update</span></a>
      <div class="ver-row mono" id="nav-version" title="The version of Harness Manager running" data-testid="nav-version"></div>
    </nav>
  </aside>
  <div class="workspace">
    <header class="topbar" data-region="topbar">
      <label class="search-box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/></svg><input id="find" type="search" aria-label="Search sessions" placeholder="Search sessions" autocomplete="off" data-testid="find"><kbd class="kbd">Ctrl K</kbd></label>
      <div class="topbar-right">
        <a id="live-strip" class="status-chip" href="#sessions?live=1" hidden data-testid="live-strip"><i class="live-dot"></i><span class="live-n"></span></a>
        <a id="pcs" class="status-chip" href="#computers" hidden title="Your computers: lit when heard from within three minutes" data-testid="computers-chip"></a>
        <span id="fresh" class="freshness-label" data-testid="fresh"></span>
        <button class="icon-btn" data-act="tour-start" title="Tour of this page" aria-label="Tour of this page" data-testid="tour-start">?</button>
        <button class="icon-btn" data-act="refresh-now" title="Refresh limits" aria-label="Refresh limits"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 11-1.5-3.5M13 3v2.5h-2.5"/></svg></button>
      </div>
    </header>
    <div id="notice" data-region="notice"></div>
    <main class="sheet" id="sheet" data-region="page" tabindex="-1"></main>
  </div>

<script type="module" src="app.js"></script>
