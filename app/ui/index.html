<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Manager</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="frame">
  <aside class="side">
    <div class="brand" id="brand"><span id="brand-mark"></span><div><b>Harness Manager</b><small id="brand-sub">Loading…</small></div></div>
    <nav class="nav" id="nav-main">
      <a data-nav="home" href="#home" data-testid="nav-home"><span data-icon="dash"></span>Overview<span class="count" id="today-cost"></span></a>
      <a data-nav="sessions" href="#sessions" data-testid="nav-sessions"><span data-icon="term"></span>Sessions<span class="count live" id="n-live" data-act="go-live" role="link" title="The sessions running now" data-testid="nav-live"></span></a>
      <a data-nav="projects" href="#projects" data-testid="nav-projects"><span data-icon="folder"></span>Projects<span class="count" id="n-projects"></span><span class="caret" data-act="nav-fold" data-fold="nav-pins" role="button" tabindex="0" aria-label="Show or hide the pinned projects" data-testid="fold-pins"></span></a>
      <div id="nav-pins" class="navfold" data-testid="nav-pins"></div>
      <a data-nav="accounts" href="#accounts" data-testid="nav-accounts"><span data-icon="users"></span>Accounts<span class="count" id="n-accounts"></span></a>
      <a id="nav-routes" href="#" data-act="routes-open" role="button" title="Each account, its tool and where its requests go, with the traffic of the last five minutes" data-testid="nav-routes"><span data-icon="route"></span>Live routes<span class="count live" id="n-tps"></span></a>
      <div class="navgap"></div>
      <a class="grp" href="#" data-act="nav-fold" data-fold="nav-setup" role="button" aria-label="Show or hide the setup pages" data-testid="nav-setup"><span data-icon="grid"></span>Setup<span class="count upd" id="apps-count" title="Tools with a newer version"></span><span class="caret"></span></a>
      <div id="nav-setup" class="navfold">
        <a class="sub" data-nav="mcp" href="#mcp" data-testid="nav-mcp"><span>MCP servers</span><span class="count" id="n-mcp"></span></a>
        <a class="sub" data-nav="skills" href="#skills" data-testid="nav-skills"><span>Skills</span><span class="count" id="n-skills"></span></a>
        <a class="sub" data-nav="prompts" href="#prompts" data-testid="nav-prompts"><span>System prompts</span></a>
        <a class="sub" data-nav="routing" href="#routing" data-testid="nav-routing"><span>API keys &amp; routing</span></a>
        <a class="sub" data-nav="apps" href="#apps" data-testid="nav-apps"><span>Apps</span></a>
      </div>
    </nav>
    <nav class="nav bottom">
      <a data-nav="cli" href="#cli" data-testid="nav-cli"><span data-icon="book"></span>CLI reference</a>
      <a data-nav="settings" href="#settings" data-testid="nav-settings"><span data-icon="gear"></span>Settings<i class="udot" id="settings-upd" title="A newer Harness Manager is available" hidden data-testid="settings-upd"></i></a>
    </nav>
  </aside>
  <header class="top">
    <label class="search"><span data-icon="search"></span><input id="find" aria-label="Find an account or session" placeholder="Find an account, session or setting" autocomplete="off" data-testid="find"><kbd>Ctrl K</kbd></label>
    <div class="right"><a id="live-strip" class="livestrip" href="#sessions?live=1" hidden data-testid="live-strip"></a><span id="fresh" data-testid="fresh"></span><button class="iconbtn help" data-act="tour-start" title="Tour of this page" aria-label="Tour of this page" data-testid="tour-start">?</button><button class="iconbtn" data-act="refresh-now" title="Refresh usage and limits" aria-label="Refresh usage and limits"><span data-icon="refresh"></span></button></div>
  </header>
  <main class="sheet" id="sheet" tabindex="-1"></main>
</div>
<div id="dialog-root"></div><div id="routes-drawer"></div>
<div id="notice" class="off" role="alert"><span id="notice-text"></span><button class="iconbtn" data-act="notice-close" aria-label="Dismiss" title="Dismiss">×</button></div>
<div id="toast" class="off" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
