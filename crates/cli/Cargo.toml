[package]
name = "hrm"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hrm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
hrm-core = { path = "../core" }
hrm-router = { path = "../router" }
rpassword = "7.5.4"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.2.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
zstd = "0.14.3"
