[package]
name = "hrm-push-relay"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
companion-proto = { path = "../companion-proto" }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
pem = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "http2"] }
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
