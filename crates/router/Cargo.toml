[package]
name = "hrm-router"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
hrm-core = { path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
