[package]
name = "hrm-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
data-encoding = "2"
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hex = "0.4.3"
if-addrs = "0.15"
mdns-sd = { version = "0.21", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
spake2 = { version = "0.4", features = ["getrandom"] }
sysinfo = "0.40.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml_edit = "0.25.17"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"
