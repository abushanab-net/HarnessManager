[package]
name = "hrm-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
sysinfo = "0.40.1"
thiserror = "2.0.21"
toml_edit = "0.25.17"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"
