name: release
# Push a tag vX.Y.Z: the app is built for Windows, macOS and Linux at the same time, signed for the updater and
# published as release X.Y.Z with latest.json (what installed copies check). Only the newest 2 releases are kept.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: { contents: write, packages: write }
concurrency: { group: release, cancel-in-progress: false }
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  draft:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs: { id: '${{ steps.r.outputs.id }}' }
    steps:
      - id: r
        run: |
          id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Harness Manager ${GITHUB_REF_NAME#v}" \
            -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows, runner: "${{ vars.RUNNER_WIN_RELEASE || 'windows-latest' }}", bundles: nsis, ext: .exe }
          # Windows on ARM: cross-compiled on the same x64 runner (the aarch64-pc-windows-msvc target and the
          # MSVC ARM64 build tools must be on the runner image); its asset lands in latest.json as windows-aarch64.
          # experimental: a failure here must not cancel the release of the other three
          - { os: windows, runner: "${{ vars.RUNNER_WIN_RELEASE || 'windows-latest' }}", bundles: nsis, ext: .exe, target: aarch64-pc-windows-msvc, experimental: true }
          # Tauri's own .dmg lays out its window through Finder, which a runner without a desktop session may not
          # control; the .dmg is made with hdiutil after the build instead
          - { os: macos, runner: "${{ vars.RUNNER_MAC_RELEASE || 'macos-latest' }}", bundles: app, ext: '' }
          # 22.04: an AppImage built on the oldest supported glibc runs on the most distributions
          - { os: linux, runner: "${{ vars.RUNNER_LINUX_RELEASE || 'ubuntu-22.04' }}", bundles: 'appimage,deb', ext: '' }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }   # self-hosted runners keep target/ between releases
      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      # the cross target goes into the toolchain cargo will actually use: the Windows runner pins its own with
      # RUSTUP_TOOLCHAIN, so the action's `targets` (which installs for stable) never reached it. On the persistent
      # self-hosted runner this installs once into its toolchain and is a no-op on every later release
      - if: matrix.target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
          test -d "$(rustc --print target-libdir --target "${{ matrix.target }}")"
      # the ARM64 cross build needs the MSVC ARM64 cross-tools environment (INCLUDE, LIB, the arm64 cl and link):
      # ring's C code is compiled by clang against the MSVC headers. This runs the installed Visual Studio's
      # vcvarsamd64_arm64; nothing is downloaded
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: amd64_arm64 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: "${{ runner.environment == 'github-hosted' && 'npm' || '' }}", cache-dependency-path: app/package-lock.json }
      - name: Version from the tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2016 # the script is JavaScript, quoted on purpose
          node -e '
            const fs = require("fs"), v = process.argv[1];
            const c = JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json")); c.version = v;
            fs.writeFileSync("app/src-tauri/tauri.conf.json", JSON.stringify(c, null, 2));
            const t = fs.readFileSync("Cargo.toml", "utf8").replace(/(\[workspace\.package\][^\[]*?version = )"[^"]*"/, `$1"${v}"`);
            fs.writeFileSync("Cargo.toml", t);' "$v"
          grep -n "^version" Cargo.toml
      - name: hrm, bundled next to the app
        shell: bash
        run: |
          # a cross-compiled build (matrix.target) lands under target/<triple>/ and the sidecar is named by that triple
          triple="${{ matrix.target }}"
          if [ -n "$triple" ]; then cargo build --release -p hrm --target "$triple"; out="target/$triple/release"
          else cargo build --release -p hrm; triple=$(rustc -vV | sed -n 's/^host: //p'); out="target/release"; fi
          mkdir -p app/src-tauri/binaries
          cp "$out/hrm${{ matrix.ext }}" "app/src-tauri/binaries/hrm-${triple}${{ matrix.ext }}"
      - run: npm ci --prefix app --no-audit --no-fund
      # Developer ID signing and notarization when the Apple secrets are set; without them the app is signed
      # ad hoc (tauri.release.conf.json) and needs Open Anyway the first time. Only set variables are exported:
      # an empty APPLE_SIGNING_IDENTITY would replace the ad hoc identity
      - name: Apple signing, when the secrets are set
        if: matrix.os == 'macos'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then echo "no Apple secrets: ad hoc signature"; exit 0; fi
          for v in CERT_PW IDENTITY AID APW TEAM; do test -n "${!v}" || { echo "Apple secret for $v is missing"; exit 1; }; done
          {
            echo "APPLE_CERTIFICATE<<CERT_END"; echo "$CERT"; echo "CERT_END"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$AID"
            echo "APPLE_PASSWORD=$APW"
            echo "APPLE_TEAM_ID=$TEAM"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: app
          tauriScript: npx tauri
          args: >-
            --bundles ${{ matrix.bundles }}
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
            --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.updater.conf.json
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: .dmg (hdiutil, no Finder)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          # an unsigned bundle downloaded from the internet is reported by macOS as "damaged"
          codesign --verify --deep --strict "$app"
          # with Developer ID the app must also be notarized, or Gatekeeper still blocks it
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then spctl --assess --type exec -vv "$app"; fi
          stage=$(mktemp -d)
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          name="Harness.Manager_${GITHUB_REF_NAME#v}_$(uname -m | sed 's/arm64/aarch64/').dmg"
          hdiutil create -volname "Harness Manager" -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/$name"
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/x-apple-diskimage" \
            --data-binary @"$RUNNER_TEMP/$name" \
            "https://uploads.github.com/repos/$GH_REPO/releases/${{ needs.draft.outputs.id }}/assets?name=$name" > /dev/null

  hub:
    # the hub's image, ghcr.io/<owner>/hrm-hub:<X.Y.Z> and :latest. The job needs the docker CLI and a daemon
    # (or buildx) on the homek8-general runners; if they have none, give them Docker rather than moving this
    # job to a GitHub-hosted runner
    runs-on: homek8-general
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - name: Build and push
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GH_REPO,,}"; image="${image%/*}/hrm-hub"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/hub/Dockerfile -t "$image:$v" -t "$image:latest" .
          docker push "$image:$v"
          docker push "$image:latest"

  publish:
    needs: [draft, build]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Publish, then keep only the newest 2 releases
        run: |
          gh api -X PATCH "repos/$GH_REPO/releases/${{ needs.draft.outputs.id }}" -F draft=false -f make_latest=true --silent
          gh release list --limit 100 --exclude-drafts --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[2:][] | .tagName' |
            while read -r tag; do echo "deleting release $tag (its tag stays)"; gh release delete "$tag" -y; done
