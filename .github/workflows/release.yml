name: release
# Push a tag vX.Y.Z: the tests run first (ci.yml); only when they pass is the app built for Windows, macOS and
# Linux one after the other, signed for the updater and published as release X.Y.Z with latest.json (what installed
# copies check). Only the newest 2 releases are kept. Every job runs on the self-hosted runners named by the
# RUNNER_* variables: a missing variable fails the job, it never falls back to a GitHub-hosted runner.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: { contents: write }
concurrency: { group: release, cancel-in-progress: false }
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}
jobs:
  test:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: test
    runs-on: ${{ vars.RUNNER_LINUX }}
    outputs: { id: '${{ steps.r.outputs.id }}' }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - id: r
        run: |
          id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Harness Manager ${GITHUB_REF_NAME#v}" \
            -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: true
      # one build at a time: each one reads latest.json from the draft, deletes it and uploads its own. Two that
      # finish in the same seconds fail with "Not Found" (1.11.0's first run), or one silently drops the other's platform
      max-parallel: 1
      matrix:
        include:
          - { os: windows, runner: "${{ vars.RUNNER_WIN_RELEASE }}", bundles: nsis, ext: .exe }
          # Windows on ARM: cross-compiled on the same x64 runner (the aarch64-pc-windows-msvc target and the
          # MSVC ARM64 build tools must be on the runner image); its asset lands in latest.json as windows-aarch64.
          # experimental: a failure here must not cancel the release of the other three
          - { os: windows, runner: "${{ vars.RUNNER_WIN_RELEASE }}", bundles: nsis, ext: .exe, target: aarch64-pc-windows-msvc, experimental: true }
          # Tauri's own .dmg lays out its window through Finder, which a runner without a desktop session may not
          # control; the .dmg is made with hdiutil after the build instead
          - { os: macos, runner: "${{ vars.RUNNER_MAC_RELEASE }}", bundles: app, ext: '' }
          # an AppImage built on the oldest supported glibc runs on the most distributions: the runner image behind
          # RUNNER_LINUX_RELEASE decides that (it was Ubuntu 22.04's when this was written)
          - { os: linux, runner: "${{ vars.RUNNER_LINUX_RELEASE }}", bundles: 'appimage,deb', ext: '' }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }   # self-hosted runners keep target/ between releases
      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with: { toolchain: stable }
      # the cross target goes into the toolchain cargo will actually use: the Windows runner pins its own with
      # RUSTUP_TOOLCHAIN, so the action's `targets` (which installs for stable) never reached it. On the persistent
      # self-hosted runner this installs once into its toolchain and is a no-op on every later release
      - if: matrix.target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
          test -d "$(rustc --print target-libdir --target "${{ matrix.target }}")"
      # the ARM64 cross build needs the MSVC ARM64 cross-tools environment (INCLUDE, LIB, the arm64 cl and link):
      # ring's C code is compiled by clang against the MSVC headers. This runs the installed Visual Studio's
      # vcvarsamd64_arm64; nothing is downloaded
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with: { arch: amd64_arm64 }
      # with the MSVC environment set, rustc takes link.exe from PATH, and in the bash steps Git's own
      # /usr/bin/link.exe (a coreutils tool) comes first: name the MSVC ARM64 linker explicitly
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          linker="${VCToolsInstallDir}bin/Hostx64/arm64/link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: "${{ runner.environment == 'github-hosted' && 'npm' || '' }}", cache-dependency-path: app/package-lock.json }
      - name: Version from the tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2016 # the script is JavaScript, quoted on purpose
          node -e '
            const fs = require("fs"), v = process.argv[1];
            const c = JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json")); c.version = v;
            fs.writeFileSync("app/src-tauri/tauri.conf.json", JSON.stringify(c, null, 2));
            const t = fs.readFileSync("Cargo.toml", "utf8").replace(/(\[workspace\.package\][^\[]*?version = )"[^"]*"/, `$1"${v}"`);
            fs.writeFileSync("Cargo.toml", t);' "$v"
          grep -n "^version" Cargo.toml
      - name: hrm, bundled next to the app
        shell: bash
        run: |
          # a cross-compiled build (matrix.target) lands under target/<triple>/ and the sidecar is named by that triple
          triple="${{ matrix.target }}"
          if [ -n "$triple" ]; then cargo build --release -p hrm --target "$triple"; out="target/$triple/release"
          else cargo build --release -p hrm; triple=$(rustc -vV | sed -n 's/^host: //p'); out="target/release"; fi
          mkdir -p app/src-tauri/binaries
          cp "$out/hrm${{ matrix.ext }}" "app/src-tauri/binaries/hrm-${triple}${{ matrix.ext }}"
      - run: npm ci --prefix app --no-audit --no-fund
      # Developer ID signing and notarization when the Apple secrets are set; without them the app is signed
      # ad hoc (tauri.release.conf.json) and needs Open Anyway the first time. Only set variables are exported:
      # an empty APPLE_SIGNING_IDENTITY would replace the ad hoc identity
      - name: Apple signing, when the secrets are set
        if: matrix.os == 'macos'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then echo "no Apple secrets: ad hoc signature"; exit 0; fi
          for v in CERT_PW IDENTITY AID APW TEAM; do test -n "${!v}" || { echo "Apple secret for $v is missing"; exit 1; }; done
          {
            echo "APPLE_CERTIFICATE<<CERT_END"; echo "$CERT"; echo "CERT_END"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$AID"
            echo "APPLE_PASSWORD=$APW"
            echo "APPLE_TEAM_ID=$TEAM"
          } >> "$GITHUB_ENV"
      # Authenticode signing when the repository variable WINDOWS_SIGNING is set; without it the Windows files are
      # unsigned, and Defender's cloud model reported the unsigned hrm.exe of 1.11.3 as a trojan (19 Nov 2026).
      # The variable holds the JSON Tauri takes under bundle.windows. For a certificate in the runner's store or
      # on its token:
      #   {"certificateThumbprint":"<sha1>","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}
      # For a signing service: {"signCommand":{"cmd":"<tool>","args":["<its arguments>","%1"]}}
      # Tauri then signs hrm.exe, the app, the uninstaller and the installer. What the tool needs to sign in
      # (a token PIN, service credentials) is set on the runner, not here.
      - name: Windows signing, when the variable is set
        id: winsign
        if: matrix.os == 'windows'
        shell: bash
        env: { SIGNING: '${{ vars.WINDOWS_SIGNING }}' }
        run: |
          if [ -z "$SIGNING" ]; then echo "no WINDOWS_SIGNING variable: the Windows files are not signed"; exit 0; fi
          node -e 'require("fs").writeFileSync("app/src-tauri/tauri.sign.conf.json", JSON.stringify({ bundle: { windows: JSON.parse(process.env.SIGNING) } }))'
          echo "args=--config src-tauri/tauri.sign.conf.json" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: app
          tauriScript: npx tauri
          args: >-
            --bundles ${{ matrix.bundles }}
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
            --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.updater.conf.json
            ${{ steps.winsign.outputs.args }}
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      # a signature Windows does not accept (wrong certificate, missing chain) fails the release here, not on a
      # user's computer. The app's own exe is not checked: the build log shows it signed before it is packed, and
      # the file left in target/ is unsigned again afterwards (seen with tauri-cli 2.12.4)
      - name: The installer and hrm.exe carry a valid signature
        if: steps.winsign.outputs.args
        shell: powershell
        run: |
          # target/ is kept between releases: only this version's installer counts
          $files = @(Get-ChildItem target -Recurse -Filter "*_$($env:GITHUB_REF_NAME.TrimStart('v'))_*-setup.exe") + @(Get-ChildItem app/src-tauri/binaries -Filter "hrm-*${{ matrix.target || 'x86_64' }}*.exe")
          if ($files.Count -lt 2) { throw "expected an installer and hrm.exe, found $($files.Count)" }
          foreach ($f in $files) { $s = Get-AuthenticodeSignature -LiteralPath $f.FullName; "$($s.Status)  $($f.FullName)"; if ($s.Status -ne 'Valid') { exit 1 } }
      - name: .dmg (hdiutil, no Finder)
        if: matrix.os == 'macos'
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          # an unsigned bundle downloaded from the internet is reported by macOS as "damaged"
          codesign --verify --deep --strict "$app"
          # with Developer ID the app must also be notarized, or Gatekeeper still blocks it
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then spctl --assess --type exec -vv "$app"; fi
          stage=$(mktemp -d)
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          name="Harness.Manager_${GITHUB_REF_NAME#v}_$(uname -m | sed 's/arm64/aarch64/').dmg"
          hdiutil create -volname "Harness Manager" -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/$name"
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/x-apple-diskimage" \
            --data-binary @"$RUNNER_TEMP/$name" \
            "https://uploads.github.com/repos/$GH_REPO/releases/${{ needs.draft.outputs.id }}/assets?name=$name" > /dev/null

  hub:
    # the hub's image, ghcr.io/<owner>/hrm-hub:<X.Y.Z> and :latest. The job needs the docker CLI and a daemon
    # (or buildx) on the homek8-general runners; if they have none, give them Docker rather than moving this
    # job to a GitHub-hosted runner. It waits for the build: no image is pushed for a release that failed
    needs: build
    runs-on: homek8-general
    permissions: { contents: read, packages: write }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - name: Build and push
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GH_REPO,,}"; image="${image%/*}/hrm-hub"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/hub/Dockerfile -t "$image:$v" -t "$image:latest" .
          docker push "$image:$v"
          docker push "$image:latest"

  publish:
    needs: [draft, build]
    runs-on: ${{ vars.RUNNER_LINUX }}
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - name: Publish, then keep only the newest 2 releases
        run: |
          gh api -X PATCH "repos/$GH_REPO/releases/${{ needs.draft.outputs.id }}" -F draft=false -f make_latest=true --silent
          gh release list --limit 100 --exclude-drafts --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[2:][] | .tagName' |
            while read -r tag; do echo "deleting release $tag (its tag stays)"; gh release delete "$tag" -y; done

  # a build that failed or was cancelled leaves no draft behind: a re-run of the tag starts from a clean slate
  discard:
    needs: [draft, build]
    if: ${{ always() && needs.draft.result == 'success' && needs.build.result != 'success' }}
    runs-on: ${{ vars.RUNNER_LINUX }}
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - run: gh api -X DELETE "repos/$GH_REPO/releases/${{ needs.draft.outputs.id }}" --silent
