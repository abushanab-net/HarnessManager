<rect x="504" y="96" width="192" height="96" rx="6" fill="#eff4f5"/><rect x="504" y="96" width="192" height="96" rx="6" fill="rgba(27,108,128,0.10)" stroke="#1b6c80" stroke-width="1"/><rect x="512" y="104" width="28" height="12" rx="2" fill="none" stroke="rgba(27,108,128,0.50)" stroke-width="0.8"/><text x="526" y="113" fill="#1b6c80" font-size="7" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SPEC</text><text x="600" y="136.5" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Launch spec</text><text x="600" y="152.5" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">clears inherited</text><text x="600" y="165.5" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">Claude variables, sets</text><text x="600" y="178.5" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">CLAUDE_CONFIG_DIR</text>
<rect x="768" y="112" width="152" height="64" rx="6" fill="#eff4f5"/><rect x="768" y="112" width="152" height="64" rx="6" fill="#ffffff" stroke="#131416" stroke-width="1"/><rect x="776" y="120" width="28" height="12" rx="2" fill="none" stroke="rgba(19,20,22,0.40)" stroke-width="0.8"/><text x="790" y="129" fill="#131416" font-size="7" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text><text x="844" y="149.5" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">claude</text><text x="844" y="165.5" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">as work-max</text>
<rect x="504" y="272" width="192" height="64" rx="6" fill="#eff4f5"/><rect x="504" y="272" width="192" height="64" rx="6" fill="rgba(27,108,128,0.05)" stroke="rgba(27,108,128,0.50)" stroke-width="1" stroke-dasharray="4,4"/><rect x="512" y="280" width="28" height="12" rx="2" fill="none" stroke="rgba(27,108,128,0.40)" stroke-width="0.8"/><text x="526" y="289" fill="#1b6c80" font-size="7" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">KEYS</text><text x="600" y="309.5" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Credential Manager</text><text x="600" y="325.5" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">HarnessManager:key:&lt;name&gt;</text>
<rect x="768" y="272" width="152" height="80" rx="6" fill="#eff4f5"/><rect x="768" y="272" width="152" height="80" rx="6" fill="rgba(19,20,22,0.05)" stroke="#5d5f60" stroke-width="1"/><rect x="776" y="280" width="28" height="12" rx="2" fill="none" stroke="rgba(93,95,96,0.50)" stroke-width="0.8"/><text x="790" y="289" fill="#5d5f60" font-size="7" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OWN</text><text x="844" y="311" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">~/.claude-work-max</text><text x="844" y="327" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">login · history</text><text x="844" y="340" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">usage · sessions</text>
<rect x="768" y="400" width="152" height="80" rx="6" fill="#eff4f5"/><rect x="768" y="400" width="152" height="80" rx="6" fill="rgba(19,20,22,0.03)" stroke="rgba(19,20,22,0.30)" stroke-width="1"/><rect x="776" y="408" width="28" height="12" rx="2" fill="none" stroke="rgba(19,20,22,0.22)" stroke-width="0.8"/><text x="790" y="417" fill="#8a8c8d" font-size="7" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MAIN</text><text x="844" y="439" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">~/.claude</text><text x="844" y="455" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">skills, commands,</text><text x="844" y="468" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">agents, plugins, rules</text>
<text x="40" y="296" fill="#5d5f60" font-size="14" font-style="italic" font-family="'IBM Plex Serif', Georgia, serif"><tspan x="40" dy="0">Codex and OpenCode work the same way,</tspan><tspan x="40" dy="20">with CODEX_HOME, or XDG_CONFIG_HOME</tspan><tspan x="40" dy="20">and XDG_DATA_HOME.</tspan></text>
<text x="40" y="392" fill="#5d5f60" font-size="14" font-style="italic" font-family="'IBM Plex Serif', Georgia, serif"><tspan x="40" dy="0">Antigravity keeps one login, so its</tspan><tspan x="40" dy="20">accounts take turns: Start swaps the</tspan><tspan x="40" dy="20">saved login in Credential Manager first.</tspan></text>
<line x1="40" y1="512" x2="920" y2="512" stroke="rgba(19,20,22,0.12)" stroke-width="0.8"/><text x="40" y="532" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="524" width="16" height="12" rx="2" fill="rgba(27,108,128,0.10)" stroke="#1b6c80" stroke-width="1"/><text x="136" y="533" fill="#5d5f60" font-size="9" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">Built per launch</text><rect x="248" y="524" width="16" height="12" rx="2" fill="rgba(19,20,22,0.05)" stroke="#5d5f60" stroke-width="1"/><text x="272" y="533" fill="#5d5f60" font-size="9" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">The account's folder</text><rect x="404" y="524" width="16" height="12" rx="2" fill="rgba(19,20,22,0.03)" stroke="rgba(19,20,22,0.30)" stroke-width="1"/><text x="428" y="533" fill="#5d5f60" font-size="9" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">Shared with main</text><rect x="540" y="524" width="16" height="12" rx="2" fill="rgba(27,108,128,0.05)" stroke="rgba(27,108,128,0.50)" stroke-width="1" stroke-dasharray="4,4"/><text x="564" y="533" fill="#5d5f60" font-size="9" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">Secrets</text><line x1="628" y1="530" x2="656" y2="530" stroke="#5d5f60" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="664" y="533" fill="#5d5f60" font-size="9" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">Only sometimes</text>
</svg>
