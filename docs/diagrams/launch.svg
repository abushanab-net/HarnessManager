<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="launch-title launch-desc">
<title id="launch-title">How an account starts in isolation</title>
<desc id="launch-desc">Start opens a terminal running hrm run, which builds the launch environment for one account: it clears inherited Claude variables, points CLAUDE_CONFIG_DIR at that account's own folder and, for an API-key account, adds the key from Credential Manager to the child process only.</desc>
<defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><style data-illustrate-export-page="true">*,*::before,*::after{box-sizing: border-box;margin: 0;padding: 0}:root{--paper: #eff4f5;--ink: #131416;--muted: #5d5f60;--sans: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;--serif: 'IBM Plex Serif', Georgia, serif;--mono: 'IBM Plex Mono', Consolas, ui-monospace, monospace}:root{font-family: var(--sans);color: var(--ink)}.frame{max-width: 1000px;margin: 0 auto}.eyebrow{font-family: var(--mono);font-size: 0.66rem;font-weight: 500;letter-spacing: 0.18em;text-transform: uppercase;color: var(--muted);margin-bottom: 0.5rem}h1{font-family: var(--serif);font-size: 1.75rem;font-weight: 400;letter-spacing: -0.01em;margin-bottom: 0.75rem}.lede{color: var(--muted);max-width: 46rem;line-height: 1.5;margin-bottom: 1.5rem}.scroll{overflow-x: auto}@media print{.scroll{overflow-x: visible}}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5f60"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1b6c80"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f8fa5"/></marker></defs>
