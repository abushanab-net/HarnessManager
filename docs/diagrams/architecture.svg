<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Harness Manager: the parts</title>
<desc id="architecture-desc">The desktop app and the hrm command line both call hrm-core, which drives one adapter per coding tool, keeps the account list, settings and a SQLite database, starts the local router, and reads keys from Windows Credential Manager.</desc>
