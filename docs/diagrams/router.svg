<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="router-title router-desc">
<title id="router-title">The local router, with failover</title>
<desc id="router-desc">A routed Claude Code account sends its request and the router token to the router on 127.0.0.1; the router reads the provider key, tries the first provider, counts its failure, converts the request to OpenAI format for the second provider, and converts the answer back.</desc>
