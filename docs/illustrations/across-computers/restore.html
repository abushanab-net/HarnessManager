<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A fresh computer gets its history back by merging</title>
  <meta name="illustration-theme" content="harness-manager/light/remote">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #eff4f5;
      --color-ink:     #131416;
      --color-muted:   #5d5f60;
      --color-accent:  #1b6c80;
      --font-sans:     'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', Georgia, serif;
      --font-mono:     'IBM Plex Mono', Consolas, ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    p.eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .diagram-container { width: 100%; overflow-x: auto; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Illustrate</p>
    <h1>A fresh computer gets its history back by merging</h1>

    <div class="diagram-container">
    <svg class="hmx-restore" viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hmx-restore-title hmx-restore-desc">
      <title id="hmx-restore-title">A fresh computer gets its history back by merging</title>
      <desc id="hmx-restore-desc">A fresh DEVELOPMENTPC with an empty database checks whether the sync folder or a backup knows its name, merges the journals of every computer including its own old one, optionally merges a backup zip, imports its own new logs, and has its history back.</desc>
      <style>
        .hmx-restore .paper { fill: #eff4f5; }
        .hmx-restore .rule { stroke: rgba(19,20,22,0.12); stroke-width: 1; }
        .hmx-restore .eyebrow { font-family: 'IBM Plex Mono', Consolas, ui-monospace, monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.18em; text-transform: none; fill: #5d5f60; }
        .hmx-restore .arrow { fill: none; stroke: #5d5f60; stroke-width: 1.2; }
        .hmx-restore .arrow-accent { fill: none; stroke: #1b6c80; stroke-width: 1.4; }
        .hmx-restore .dashed { stroke-dasharray: 5,4; }
        .hmx-restore .mask { fill: #eff4f5; }
        .hmx-restore .arrow-label { font-family: 'IBM Plex Mono', Consolas, ui-monospace, monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.12em; fill: #5d5f60; text-anchor: middle; }
        .hmx-restore .arrow-label.focal { fill: #1b6c80; }
        .hmx-restore .box { fill: #ffffff; stroke: #131416; stroke-width: 1; }
        .hmx-restore .box.focal { fill: rgba(27,108,128,0.10); stroke: #1b6c80; }
        .hmx-restore .box.store { fill: rgba(19,20,22,0.05); stroke: #5d5f60; }
        .hmx-restore .box.optional { fill: rgba(19,20,22,0.02); stroke: rgba(19,20,22,0.20); stroke-dasharray: 4,3; }
        .hmx-restore .tag { fill: rgba(19,20,22,0.08); }
        .hmx-restore .tag-text { font-family: 'IBM Plex Mono', Consolas, ui-monospace, monospace; font-size: 8px; font-weight: 500; fill: #131416; text-anchor: middle; }
        .hmx-restore .node-name { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #131416; }
        .hmx-restore .sublabel { font-family: 'IBM Plex Mono', Consolas, ui-monospace, monospace; font-size: 9px; fill: #5d5f60; }
        .hmx-restore .centered { text-anchor: middle; }
        .hmx-restore .callout { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 14px; font-style: italic; fill: #131416; text-anchor: end; }
        .hmx-restore .leader { fill: none; stroke: rgba(19,20,22,0.40); stroke-width: 1; stroke-dasharray: 4,3; }
        .hmx-restore .dot { fill: #131416; }
        .hmx-restore .legend-key { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 9px; fill: #5d5f60; }
      </style>
      <defs>
        <marker id="hmx-restore-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5f60"/></marker>
        <marker id="hmx-restore-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1b6c80"/></marker>
      </defs>

      <rect class="paper" width="100%" height="100%"/>

      <!-- Arrows (drawn before nodes) -->
      <line class="arrow" x1="400" y1="64" x2="400" y2="96" marker-end="url(#hmx-restore-arrow)"/>
      <line class="arrow" x1="400" y1="200" x2="400" y2="232" marker-end="url(#hmx-restore-arrow)"/>
      <path class="arrow" d="M 250 148 H 208 Q 200 148 200 156 V 448 Q 200 456 208 456 H 264" marker-end="url(#hmx-restore-arrow)"/>
      <line class="arrow" x1="400" y1="296" x2="400" y2="328" marker-end="url(#hmx-restore-arrow)"/>
      <line class="arrow" x1="400" y1="392" x2="400" y2="424" marker-end="url(#hmx-restore-arrow)"/>
      <line class="arrow" x1="400" y1="488" x2="400" y2="520" marker-end="url(#hmx-restore-arrow)"/>
      <line class="arrow-accent" x1="624" y1="264" x2="536" y2="264" marker-end="url(#hmx-restore-arrow-accent)"/>
      <line class="arrow dashed" x1="624" y1="360" x2="536" y2="360" marker-end="url(#hmx-restore-arrow)"/>

      <!-- Arrow labels -->
      <rect class="mask" x="410" y="210" width="30" height="12" rx="2"/>
      <text class="arrow-label" x="425" y="219">YES</text>
      <rect class="mask" x="166" y="290" width="24" height="12" rx="2"/>
      <text class="arrow-label" x="178" y="299">NO</text>
      <rect class="mask" x="544" y="242" width="72" height="12" rx="2"/>
      <text class="arrow-label focal" x="580" y="251">MERGES ALL</text>
      <rect class="mask" x="544" y="338" width="72" height="12" rx="2"/>
      <text class="arrow-label" x="580" y="347">OPTIONAL</text>

      <!-- 1 start: fresh DEVELOPMENTPC -->
      <rect class="box" x="240" y="16" width="320" height="48" rx="24"/>
      <rect class="tag" x="264" y="34" width="16" height="12" rx="2"/>
      <text class="tag-text" x="272" y="43">1</text>
      <text class="node-name centered" x="400" y="38">fresh DEVELOPMENTPC, first launch</text>
      <text class="sublabel centered" x="400" y="52">empty hm.db</text>

      <!-- 2 decision: Welcome back? -->
      <polygon class="box" points="400,96 550,148 400,200 250,148"/>
      <rect class="tag" x="392" y="108" width="16" height="12" rx="2"/>
      <text class="tag-text" x="400" y="117">2</text>
      <text class="node-name centered" x="400" y="146">Welcome back?</text>
      <text class="sublabel centered" x="400" y="160">the sync folder or a backup</text>
      <text class="sublabel centered" x="400" y="171">knows this computer's name</text>

      <!-- 3 merge the journals -->
      <rect class="box" x="264" y="232" width="272" height="64" rx="6"/>
      <rect class="tag" x="272" y="238" width="16" height="12" rx="2"/>
      <text class="tag-text" x="280" y="247">3</text>
      <text class="node-name" x="272" y="264">merge the journals of every computer</text>
      <text class="sublabel" x="272" y="277">including its own old one,</text>
      <text class="sublabel" x="272" y="288">as a new incarnation</text>

      <!-- sync folder (data, focal) -->
      <rect class="box focal" x="624" y="232" width="296" height="64" rx="6"/>
      <text class="node-name" x="636" y="258">sync folder</text>
      <text class="sublabel" x="636" y="272">developmentpc-2024/ · laptop/ ·</text>
      <text class="sublabel" x="636" y="284">workpc/ · archive/</text>

      <!-- 4 merge a backup zip (optional) -->
      <rect class="box optional" x="264" y="328" width="272" height="64" rx="6"/>
      <rect class="tag" x="272" y="334" width="16" height="12" rx="2"/>
      <text class="tag-text" x="280" y="343">4</text>
      <text class="node-name" x="272" y="360">merge a backup zip</text>
      <text class="sublabel" x="272" y="373">settings · ledger · skills · optional</text>

      <!-- backup zip (data) -->
      <rect class="box store" x="624" y="328" width="160" height="64" rx="6"/>
      <text class="node-name" x="636" y="364">backup zip</text>

      <!-- 5 import its own new logs -->
      <rect class="box" x="264" y="424" width="272" height="64" rx="6"/>
      <rect class="tag" x="272" y="430" width="16" height="12" rx="2"/>
      <text class="tag-text" x="280" y="439">5</text>
      <text class="node-name" x="272" y="456">import its own new logs</text>
      <text class="sublabel" x="272" y="469">as today</text>

      <!-- 6 end: history is back (focal) -->
      <rect class="box focal" x="240" y="520" width="320" height="60" rx="30"/>
      <rect class="tag" x="270" y="544" width="16" height="12" rx="2"/>
      <text class="tag-text" x="278" y="553">6</text>
      <text class="node-name centered" x="400" y="544">history is back</text>
      <text class="sublabel centered" x="400" y="558">Activity grid, costs, sessions,</text>
      <text class="sublabel centered" x="400" y="569">archived transcripts</text>

      <!-- Callout -->
      <text class="callout" x="920" y="40">nothing is counted twice:</text>
      <text class="callout" x="920" y="58">usage rows keep their request ids</text>
      <path class="leader" d="M 780 66 Q 772 150 780 228"/>
      <circle class="dot" cx="780" cy="230" r="2"/>

      <!-- Legend -->
      <line class="rule" x1="40" y1="608" x2="920" y2="608"/>
      <text class="eyebrow" x="40" y="624">LEGEND</text>
      <rect class="box" x="40" y="636" width="14" height="10" rx="5"/>
      <text class="legend-key" x="60" y="644">Start, end</text>
      <rect class="box" x="124" y="636" width="14" height="10" rx="2"/>
      <text class="legend-key" x="144" y="644">Step</text>
      <polygon class="box" points="192,636 199,641 192,646 185,641"/>
      <text class="legend-key" x="208" y="644">Decision</text>
      <rect class="box optional" x="268" y="636" width="14" height="10" rx="2"/>
      <text class="legend-key" x="288" y="644">Optional</text>
      <rect class="box store" x="344" y="636" width="14" height="10" rx="2"/>
      <text class="legend-key" x="364" y="644">Data</text>
      <rect class="box focal" x="400" y="636" width="14" height="10" rx="2"/>
      <text class="legend-key" x="420" y="644">What is merged, what you get</text>
    </svg>
    </div>
  </div>
</body>
</html>
