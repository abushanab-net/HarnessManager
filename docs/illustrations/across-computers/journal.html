<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One journal per computer, merged everywhere</title>
  <meta name="illustration-theme" content="harness-manager/light/remote">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #eff4f5;
      --color-ink:     #131416;
      --color-muted:   #5d5f60;
      --color-accent:  #1b6c80;
      --font-sans:     'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', Georgia, serif;
      --font-mono:     'IBM Plex Mono', Consolas, ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    /* min-width == viewBox width keeps the type ramp; this wrapper scrolls the diagram, not the page. */
    .diagram-container { width: 100%; overflow-x: auto; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Illustrate</p>
    <h1>One journal per computer, merged everywhere</h1>

    <div class="diagram-container">
    <!-- Self-contained SVG: every visual property is a presentation attribute; no CSS outside the svg is needed. -->
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hmx-journal-title hmx-journal-desc">
      <title id="hmx-journal-title">One journal per computer, merged everywhere</title>
      <desc id="hmx-journal-desc">Each computer's hm.db appends to its own append-only journal, publishes it through a transport, and merges the other computer's journal so its views can show this computer or all computers.</desc>
      <defs>
        <marker id="hmx-journal-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5f60"/></marker>
        <marker id="hmx-journal-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1b6c80"/></marker>
        <marker id="hmx-journal-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f8fa5"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#eff4f5"/>

      <!-- Zones -->
      <rect x="40" y="160" width="360" height="288" rx="8" fill="rgba(19,20,22,0.02)" stroke="rgba(19,20,22,0.10)" stroke-width="0.8"/>
      <rect x="180" y="164" width="80" height="12" rx="2" fill="#eff4f5"/>
      <text class="eyebrow" x="220" y="173" fill="rgba(19,20,22,0.40)" font-size="7" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DEVELOPMENTPC</text>

      <rect x="560" y="160" width="360" height="288" rx="8" fill="rgba(19,20,22,0.02)" stroke="rgba(19,20,22,0.10)" stroke-width="0.8"/>
      <rect x="716" y="164" width="48" height="12" rx="2" fill="#eff4f5"/>
      <text class="eyebrow" x="740" y="173" fill="rgba(19,20,22,0.40)" font-size="7" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">LAPTOP</text>

      <!-- Arrows (before nodes) -->
      <!-- DEVELOPMENTPC: hm.db -> journal (APPENDS), hm.db -> views (READS) -->
      <path d="M244,256 V296 Q244,304 252,304 H288 Q296,304 296,312 V352" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>
      <path d="M196,256 V296 Q196,304 188,304 H128 Q120,304 120,312 V352" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>
      <!-- LAPTOP -->
      <path d="M716,256 V296 Q716,304 708,304 H672 Q664,304 664,312 V352" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>
      <path d="M764,256 V296 Q764,304 772,304 H832 Q840,304 840,312 V352" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>
      <!-- journal -> transport (PUBLISHES) -->
      <path d="M384,384 H448 Q456,384 456,376 V328" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>
      <path d="M576,384 H512 Q504,384 504,376 V328" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>
      <!-- transport -> the other computer's hm.db (MERGES) -->
      <path d="M416,288 H368 Q360,288 360,280 V232 Q360,224 352,224 H288" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>
      <path d="M544,288 H592 Q600,288 600,280 V232 Q600,224 608,224 H672" fill="none" stroke="#5d5f60" stroke-width="1.2" marker-end="url(#hmx-journal-arrow)"/>

      <!-- Arrow labels -->
      <rect x="252" y="270" width="48" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="276" y="279" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPENDS</text>
      <rect x="152" y="270" width="36" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="170" y="279" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
      <rect x="660" y="270" width="48" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="684" y="279" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPENDS</text>
      <rect x="772" y="270" width="36" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="790" y="279" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
      <rect x="388" y="366" width="56" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="416" y="375" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISHES</text>
      <rect x="516" y="366" width="56" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="544" y="375" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISHES</text>
      <rect x="296" y="206" width="48" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="320" y="215" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MERGES</text>
      <rect x="616" y="206" width="48" height="12" rx="2" fill="#eff4f5"/>
      <text class="arrow-label" x="640" y="215" fill="#5d5f60" font-size="8" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MERGES</text>

      <!-- Nodes: DEVELOPMENTPC -->
      <rect x="152" y="192" width="136" height="64" rx="6" fill="#eff4f5"/>
      <rect x="152" y="192" width="136" height="64" rx="6" fill="rgba(19,20,22,0.05)" stroke="#5d5f60" stroke-width="1"/>
      <text class="node-name" x="220" y="228" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">hm.db</text>
      <text class="sublabel" x="220" y="244" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">+ device column</text>

      <rect x="56" y="352" width="128" height="64" rx="6" fill="#eff4f5"/>
      <rect x="56" y="352" width="128" height="64" rx="6" fill="#ffffff" stroke="#131416" stroke-width="1"/>
      <text class="node-name" x="120" y="384" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">views</text>
      <text class="sublabel" x="120" y="398" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">this computer</text>
      <text class="sublabel" x="120" y="409" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">all computers</text>

      <rect x="208" y="352" width="176" height="64" rx="6" fill="#eff4f5"/>
      <rect x="208" y="352" width="176" height="64" rx="6" fill="rgba(27,108,128,0.10)" stroke="#1b6c80" stroke-width="1"/>
      <text class="node-name" x="296" y="388" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">journal: DEVELOPMENTPC</text>
      <text class="sublabel" x="296" y="404" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">append-only · one writer</text>

      <!-- Nodes: LAPTOP -->
      <rect x="672" y="192" width="136" height="64" rx="6" fill="#eff4f5"/>
      <rect x="672" y="192" width="136" height="64" rx="6" fill="rgba(19,20,22,0.05)" stroke="#5d5f60" stroke-width="1"/>
      <text class="node-name" x="740" y="228" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">hm.db</text>
      <text class="sublabel" x="740" y="244" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">+ device column</text>

      <rect x="576" y="352" width="176" height="64" rx="6" fill="#eff4f5"/>
      <rect x="576" y="352" width="176" height="64" rx="6" fill="rgba(27,108,128,0.10)" stroke="#1b6c80" stroke-width="1"/>
      <text class="node-name" x="664" y="388" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">journal: LAPTOP</text>
      <text class="sublabel" x="664" y="404" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">append-only · one writer</text>

      <rect x="776" y="352" width="128" height="64" rx="6" fill="#eff4f5"/>
      <rect x="776" y="352" width="128" height="64" rx="6" fill="#ffffff" stroke="#131416" stroke-width="1"/>
      <text class="node-name" x="840" y="384" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">views</text>
      <text class="sublabel" x="840" y="398" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">this computer</text>
      <text class="sublabel" x="840" y="409" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">all computers</text>

      <!-- Node: transport (replaceable, dashed) -->
      <rect x="416" y="264" width="128" height="64" rx="6" fill="#eff4f5"/>
      <rect x="416" y="264" width="128" height="64" rx="6" fill="rgba(19,20,22,0.02)" stroke="#5d5f60" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="node-name" x="480" y="300" fill="#131416" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">transport</text>
      <text class="sublabel" x="480" y="316" fill="#5d5f60" font-size="9" font-family="'IBM Plex Mono', Consolas, ui-monospace, monospace" text-anchor="middle">folder · peers · hub</text>

      <!-- Callout -->
      <path d="M328,496 Q296,488 296,428" fill="none" stroke="rgba(19,20,22,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="296" cy="424" r="2" fill="#131416"/>
      <text class="callout" x="336" y="504" fill="#131416" font-size="14" font-style="italic" font-family="'IBM Plex Serif', Georgia, serif">cost is frozen per row with its price snapshot</text>
    </svg>
    </div>
  </div>
</body>
</html>
